name: Build y deploy a GitHub Pages

on:
  schedule:
    # Cada 2 horas. Los cambios de precio/stock ya se ven en minutos gracias
    # al fetch en vivo del navegador — este cron es solo para que los
    # productos NUEVOS o eliminados en la Sheet generen sus páginas propias
    # (SEO) sin que nadie tenga que acordarse de correr el build a mano.
    #
    # Antes era una vez al día porque en Netlify cada corrida gastaba
    # créditos del plan gratis. GitHub Pages no cobra por frecuencia en un
    # repo público, así que no hay razón de costo para dejar esperando hasta
    # 24h a que un producto nuevo tenga página — solo hasta 2h.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# Si se hacen varios pushes seguidos, cancela la publicación anterior que
# todavía esté corriendo en vez de dejar que las dos terminen a la vez —
# así nunca hay riesgo de que una versión vieja termine de publicarse
# después que una nueva y la tape.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar las páginas (build.js)
        run: node build.js

      - name: Quitar archivos que no debe servir el sitio
        run: rm -rf .git

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

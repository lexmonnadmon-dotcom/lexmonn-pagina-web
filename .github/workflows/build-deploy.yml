name: Build y deploy a Netlify

on:
  schedule:
    # Cada 6 horas (UTC). Los cambios de precio/stock ya se ven en minutos
    # gracias al fetch en vivo del navegador — este cron es para que los
    # productos NUEVOS o eliminados en la Sheet generen sus páginas propias
    # (SEO) sin que nadie tenga que acordarse de correr el build a mano.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# Si se hacen varios pushes seguidos, cancela la publicación anterior que
# todavía esté corriendo en vez de dejar que las dos terminen a la vez —
# así nunca hay riesgo de que una versión vieja termine de publicarse
# después que una nueva y la tape.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar las páginas (build.js)
        run: node build.js

      - name: Deploy a Netlify
        run: npx netlify-cli deploy --prod --dir=. --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
